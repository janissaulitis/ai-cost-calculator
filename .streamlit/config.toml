[theme]
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap, sans-serif"
baseFontWeight = 500
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#C24400"
backgroundColor = "#E6E6E3"
secondaryBackgroundColor = "#F5F5F2"
textColor = "#111111"

[theme.dark]
primaryColor = "#FF6A13"
backgroundColor = "#121212"
secondaryBackgroundColor = "#1D1D1C"
textColor = "#ECECE8"
