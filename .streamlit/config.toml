[theme]
font = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap, sans-serif"
baseFontWeight = 500
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1A2B"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121B2B"
textColor = "#E6ECF3"
